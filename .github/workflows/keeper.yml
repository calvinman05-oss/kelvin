name: keeper

# Mirrors Gemini Prediction Markets onto Arc and settles cover.
# Each run loops for about five and a half hours; the next run queues behind it, so coverage is continuous.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 3500
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node keeper.mjs --loop 90
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          ORACLE_ADDRESS: "0xB31798e27e4E0c9b24B447917bcdAa4DdFFc8044"
          VAULT_ADDRESS: "0xFF011934e1ADE727cb6271C1BBdCfd668164300b"
          KEEPER_MAX_MINUTES: "330"
